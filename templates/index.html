<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Fuzzy Kualitas Tidur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    <div class="container">
        <div class="header">
            <h1>NEURO-SLEEP <span>ANALYZER</span></h1>
            <p>Sistem Inferensi Fuzzy Evaluasi Kualitas Tidur Mahasiswa</p>
        </div>

        <form id="sleepForm">
            <div class="input-group">
                <label for="durasi">Durasi Tidur (Jam)</label>
                <input type="number" id="durasi" min="0" max="12" step="0.1" placeholder="Misal: 7" required>
            </div>

            <div class="input-group">
                <label for="gangguan">Tingkat Gangguan (0-10)</label>
                <input type="number" id="gangguan" min="0" max="10" step="0.1" placeholder="0 = Tidak ada, 10 = Ekstrem" required>
            </div>

            <div class="input-group">
                <label for="konsistensi">Konsistensi Tidur (0-10)</label>
                <input type="number" id="konsistensi" min="0" max="10" step="0.1" placeholder="0 = Buruk, 10 = Sangat Konsisten" required>
            </div>

            <div class="input-group">
                <label for="stres">Tingkat Stres (0-10)</label>
                <input type="number" id="stres" min="0" max="10" step="0.1" placeholder="0 = Santai, 10 = Sangat Stres" required>
            </div>

            <button type="submit" id="submitBtn">
                <span class="btn-text">INITIALIZE CALCULATION</span>
                <span class="loader" style="display: none;"></span>
            </button>
        </form>

        <div id="hasilBox" class="hidden">
            <h2>DIAGNOSTIC RESULT</h2>
            <div class="result-details">
                <div class="score-ring">
                    <svg viewBox="0 0 36 36" class="circular-chart cyan">
                        <path class="circle-bg"
                        d="M18 2.0845
                        a 15.9155 15.9155 0 0 1 0 31.831
                        a 15.9155 15.9155 0 0 1 0 -31.831"
                        />
                        <path class="circle" id="scoreCircle"
                        stroke-dasharray="0, 100"
                        d="M18 2.0845
                        a 15.9155 15.9155 0 0 1 0 31.831
                        a 15.9155 15.9155 0 0 1 0 -31.831"
                        />
                        <text x="18" y="20.35" class="percentage" id="scoreText">0.0</text>
                    </svg>
                </div>
                <div class="category">
                    <h3>STATUS: <span id="kategoriText" class="neon-text">--</span></h3>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>

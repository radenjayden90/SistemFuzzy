<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background: #050508;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .test {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid #00f3ff;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="test">
        <h1>TEST PAGE</h1>
        <p>If you can see this with blue border and dark background, CSS is working.</p>
        <button onclick="testAPI()">Test API Connection</button>
        <div id="result"></div>
    </div>
    
    <script>
    async function testAPI() {
        try {
            const response = await fetch('http://127.0.0.1:5000/fuzzy', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({durasi:7, gangguan:3, konsistensi:8, stres:2})
            });
            const data = await response.json();
            document.getElementById('result').innerHTML = 
                '<h3>API SUCCESS!</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>';
        } catch (error) {
            document.getElementById('result').innerHTML = 
                '<h3>API ERROR:</h3><p>' + error.message + '</p>';
        }
    }
    </script>
</body>
</html>
